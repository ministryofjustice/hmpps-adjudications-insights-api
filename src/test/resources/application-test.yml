spring:
  main:
    allow-bean-definition-overriding: true

oauth:
  endpoint:
    url: http://localhost:9090/auth

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0
